name: AgentForge build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_AGENT0_GRAPH_API_KEY: ${{ secrets.AGENT0_GRAPH_API_KEY }}
      VITE_AGENT0_SUBGRAPH_ID: ${{ vars.AGENT0_SUBGRAPH_ID }}
      VITE_BSC_TESTNET_RPC_URL: ${{ vars.BSC_TESTNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
